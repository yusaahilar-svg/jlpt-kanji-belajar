
name: Build JLPT Kanji Website

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build website
        run: bundle exec jekyll build --future --trace

      - name: Save website output
        uses: actions/upload-artifact@v4
        with:
          name: jlpt-kanji-website
          path: _site/
          if-no-files-found: error
